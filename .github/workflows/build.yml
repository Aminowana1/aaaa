name: Build MDVEconomy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y verificar con Maven
        run: mvn --batch-mode --no-transfer-progress -Dstyle.color=never clean verify

      - name: Empaquetar el JAR definido por Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -Dstyle.color=never org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.build.finalName -Doutput=target/build-final-name.txt
          FINAL_NAME="$(cat target/build-final-name.txt)"
          test -n "$FINAL_NAME"
          test -s "target/$FINAL_NAME.jar"
          python3 scripts/verify_jar.py "target/$FINAL_NAME.jar"
          mkdir -p dist
          cp "target/$FINAL_NAME.jar" dist/
          cd dist
          zip "$FINAL_NAME-Server.zip" "$FINAL_NAME.jar"

      - name: Subir ZIP para servidor
        uses: actions/upload-artifact@v4
        with:
          name: MDVEconomy-server-${{ github.run_number }}
          path: dist/*-Server.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
